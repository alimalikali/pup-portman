name: Bug report
description: Report a defect in pup-portman
labels: ['bug']
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run and what was the unexpected result?
      placeholder: I ran `pup-portman 3000` and ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open terminal
        2. Run `pup-portman list`
        3. Observe ...
    validations:
      required: true
  - type: input
    id: pup-portman-version
    attributes:
      label: pup-portman version
      description: Output of `pup-portman --version`
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Run with `DEBUG=pup-portman` for verbose output
      render: shell
